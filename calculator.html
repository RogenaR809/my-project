<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <!-- ================= META ================= -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- ================= TITLE ================= -->

    <title>Car Installments Calculator</title>


    <!-- ================= BOOTSTRAP CSS ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- ================================================= -->
    <!--                    MAIN CONTAINER                 -->
    <!-- ================================================= -->

    <div class="container py-5">


        <!-- ================================================= -->
        <!--                       HEADER                      -->
        <!-- ================================================= -->

        <div class="text-center mb-5">

            <h1 class="fw-bold text-primary">
                🚗 حاسبة أقساط السيارات
            </h1>

            <p class="text-secondary">
                احسب القسط الشهري للسيارة بسهولة
            </p>

        </div>


        <!-- ================================================= -->
        <!--                    CALCULATOR CARD                -->
        <!-- ================================================= -->

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">


                <div class="card border-0 shadow-lg rounded-4">


                    <!-- ================= CARD HEADER ================= -->

                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">

                        <h3 class="mb-1 fw-bold">
                            Car Installments Calculator
                        </h3>

                        <p class="mb-0">
                            أدخل بيانات السيارة
                        </p>

                    </div>


                    <!-- ================= CARD BODY ================= -->

                    <div class="card-body p-4 p-md-5">


                        <!-- ================================================= -->
                        <!--                    INPUTS                         -->
                        <!-- ================================================= -->

                        <div class="row g-4">


                            <!-- ================= CAR TYPE ================= -->

                            <div class="col-12 col-md-6">

                                <label
                                    for="carType"
                                    class="form-label fw-semibold">

                                    نوع السيارة

                                </label>


                                <select
                                    id="carType"
                                    class="form-select">

                                    <option selected>
                                        اختر نوع السيارة
                                    </option>

                                    <option>
                                        Sedan
                                    </option>

                                    <option>
                                        SUV
                                    </option>

                                    <option>
                                        Hatchback
                                    </option>

                                    <option>
                                        Coupe
                                    </option>

                                    <option>
                                        Pickup
                                    </option>

                                </select>

                            </div>


                            <!-- ================= CAR MODEL ================= -->

                            <div class="col-12 col-md-6">

                                <label
                                    for="carModel"
                                    class="form-label fw-semibold">

                                    موديل السيارة

                                </label>


                                <input
                                    type="text"
                                    id="carModel"
                                    class="form-control"
                                    placeholder="مثال: Toyota Corolla">

                            </div>


                            <!-- ================= CAR PRICE ================= -->

                            <div class="col-12 col-md-6">

                                <label
                                    for="carPrice"
                                    class="form-label fw-semibold">

                                    سعر السيارة

                                </label>


                                <div class="input-group">

                                    <input
                                        type="number"
                                        id="carPrice"
                                        class="form-control"
                                        placeholder="مثال: 800000">

                                    <span class="input-group-text">
                                        جنيه
                                    </span>

                                </div>

                            </div>


                            <!-- ================= DOWN PAYMENT ================= -->

                            <div class="col-12 col-md-6">

                                <label
                                    for="downPayment"
                                    class="form-label fw-semibold">

                                    قيمة المقدم

                                </label>


                                <div class="input-group">

                                    <input
                                        type="number"
                                        id="downPayment"
                                        class="form-control"
                                        placeholder="مثال: 200000">

                                    <span class="input-group-text">
                                        جنيه
                                    </span>

                                </div>

                            </div>


                            <!-- ================= INSTALLMENT PERIOD ================= -->

                            <div class="col-12 col-md-6">

                                <label
                                    for="duration"
                                    class="form-label fw-semibold">

                                    مدة التقسيط

                                </label>


                                <select
                                    id="duration"
                                    class="form-select">

                                    <option selected>
                                        اختر مدة التقسيط
                                    </option>

                                    <option>
                                        سنة واحدة - 12 شهر
                                    </option>

                                    <option>
                                        سنتان - 24 شهر
                                    </option>

                                    <option>
                                        3 سنوات - 36 شهر
                                    </option>

                                    <option>
                                        4 سنوات - 48 شهر
                                    </option>

                                    <option>
                                        5 سنوات - 60 شهر
                                    </option>

                                    <option>
                                        6 سنوات - 72 شهر
                                    </option>

                                </select>

                            </div>


                            <!-- ================= INTEREST RATE ================= -->

                            <div class="col-12 col-md-6">

                                <label
                                    for="interest"
                                    class="form-label fw-semibold">

                                    نسبة الفائدة السنوية

                                </label>


                                <div class="input-group">

                                    <input
                                        type="number"
                                        id="interest"
                                        class="form-control"
                                        placeholder="مثال: 10">

                                    <span class="input-group-text">
                                        %
                                    </span>

                                </div>

                            </div>


                        </div>


                        <!-- ================================================= -->
                        <!--                    CALCULATE BUTTON               -->
                        <!-- ================================================= -->

                        <div class="d-grid mt-4">

                            <button
                                type="button"
                                class="btn btn-primary btn-lg">

                                احسب القسط

                            </button>

                        </div>


                        <!-- ================================================= -->
                        <!--                    RESULT SECTION                -->
                        <!-- ================================================= -->

                        <div class="mt-5">


                            <h4 class="fw-bold mb-4 text-center">
                                نتيجة الحساب
                            </h4>


                            <div class="row g-3">


                                <!-- ================= MONTHLY INSTALLMENT ================= -->

                                <div class="col-12 col-md-6">

                                    <div class="card bg-primary text-white border-0 h-100">

                                        <div class="card-body text-center p-4">

                                            <h6 class="mb-3">
                                                القسط الشهري
                                            </h6>

                                            <h2 class="fw-bold">
                                                15,000
                                                <small class="fs-6">
                                                    جنيه
                                                </small>
                                            </h2>

                                        </div>

                                    </div>

                                </div>


                                <!-- ================= INTEREST ================= -->

                                <div class="col-12 col-md-6">

                                    <div class="card bg-light border h-100">

                                        <div class="card-body text-center p-4">

                                            <h6 class="text-secondary mb-3">
                                                نسبة الفائدة
                                            </h6>

                                            <h2 class="fw-bold text-primary">
                                                10%
                                            </h2>

                                        </div>

                                    </div>

                                </div>


                                <!-- ================= FINANCED AMOUNT ================= -->

                                <div class="col-12 col-md-6">

                                    <div class="card bg-light border h-100">

                                        <div class="card-body text-center p-4">

                                            <h6 class="text-secondary mb-3">
                                                المبلغ المتبقي للتمويل
                                            </h6>

                                            <h2 class="fw-bold text-dark">
                                                600,000
                                            </h2>

                                            <span class="text-secondary">
                                                جنيه
                                            </span>

                                        </div>

                                    </div>

                                </div>


                                <!-- ================= TOTAL AMOUNT ================= -->

                                <div class="col-12 col-md-6">

                                    <div class="card bg-light border h-100">

                                        <div class="card-body text-center p-4">

                                            <h6 class="text-secondary mb-3">
                                                إجمالي المبلغ بعد الفائدة
                                            </h6>

                                            <h2 class="fw-bold text-dark">
                                                900,000
                                            </h2>

                                            <span class="text-secondary">
                                                جنيه
                                            </span>

                                        </div>

                                    </div>

                                </div>


                            </div>

                        </div>


                    </div>


                    <!-- ================= CARD FOOTER ================= -->

                    <div class="card-footer text-center text-secondary bg-white py-3">

                        Car Installments Calculator © 2026

                    </div>


                </div>


            </div>

        </div>


    </div>


    <!-- ================= BOOTSTRAP JS NOT USED ================= -->
    <!-- لا يوجد JavaScript لأن المطلوب HTML + Bootstrap CSS فقط -->

</body>

</html>
